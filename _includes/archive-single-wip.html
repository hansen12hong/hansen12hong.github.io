{% include base_path %}

{% if post.id %}
  {% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}
{% else %}
  {% assign title = post.title %}
{% endif %}

<div class="wip-item">
  <span class="wip-title">{{ title }}</span>
  {% if post.coauthors %}
  <span class="wip-coauthors">(with {{ post.coauthors }})</span>
  {% endif %}
</div>
